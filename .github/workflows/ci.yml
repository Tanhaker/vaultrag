name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend · RLS, trust layer, red team
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: vaultrag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vault -d vaultrag"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: vaultrag
      DB_OWNER_USER: vault
      DB_OWNER_PASSWORD: ci-owner-password
      DB_READER_PASSWORD: ci-reader-password
      DB_WRITER_PASSWORD: ci-writer-password
      JWT_SECRET: ci-jwt-secret-not-for-production
      CTX_HMAC_SECRET: ci-ctx-secret-not-for-production
      # Offline mode: hash embeddings, Tesseract OCR, verbatim composer. No API key in CI.
      LLM_MODE: "off"
      EMBEDDING_PROVIDER: hash
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Tesseract OCR
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
      - run: pip install -r requirements.txt
      - name: Migrate, seed and ingest the demo corpus
        run: |
          python -m app.cli migrate
          python -m app.cli seed
          python -m app.cli ingest-demo
      - name: pytest (RLS matrix, trust layer, red-team suite, units)
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: Frontend · typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
